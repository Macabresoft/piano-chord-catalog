<div class="big-skull">
  <div class="card">
    @for (line of bigSkull; track line) {
      <div class="pixel-line center">
        @for (character of line | split; track character) {
          <div class="pixel" [ngClass]="{filled: character === '#'}"></div>
        }
      </div>
    }
  </div>
</div>
